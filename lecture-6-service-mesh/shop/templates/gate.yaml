{{- if .Values.gate.enabled }}
# Canary gate: читает здоровье v2 из Prometheus и меняет веса HTTPRoute.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shop.fullname" . }}-gate
  labels:
    {{- include "shop.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shop.fullname" . }}-gate
  labels:
    {{- include "shop.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    resourceNames: [{{ include "shop.fullname" . }}-api-split]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shop.fullname" . }}-gate
  labels:
    {{- include "shop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shop.fullname" . }}-gate
subjects:
  - kind: ServiceAccount
    name: {{ include "shop.fullname" . }}-gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.fullname" . }}-gate
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: gate
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "root" . "component" "gate") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.selectorLabels" (dict "root" . "component" "gate") | nindent 8 }}
      annotations:
        # перезапуск gate при каждом релизе — новый прогон canary
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      serviceAccountName: {{ include "shop.fullname" . }}-gate
      containers:
        - name: gate
          image: "{{ .Values.gate.image.repository }}:{{ .Values.gate.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: ROUTE
              value: {{ include "shop.fullname" . }}-api-split
            - name: V2_BACKEND
              value: {{ include "shop.fullname" . }}-api-v2
            {{- range $k, $v := .Values.gate.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
