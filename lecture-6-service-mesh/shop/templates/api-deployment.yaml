{{- range $name, $v := .Values.api.versions }}
{{- if $v.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.fullname" $ }}-api-{{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
    app.kubernetes.io/version: {{ $name }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
      app.kubernetes.io/version: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "shop.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
        app.kubernetes.io/version: {{ $name }}
      {{- if $.Values.mesh.enabled }}
      annotations:
        {{- toYaml $.Values.mesh.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.api.terminationGracePeriodSeconds }}
      priorityClassName: {{ $.Values.api.priorityClassName }}
      securityContext:
        runAsNonRoot: {{ $.Values.securityContext.runAsNonRoot }}
        runAsUser: {{ $.Values.securityContext.runAsUser }}
        seccompProfile:
          type: {{ $.Values.securityContext.seccompProfile.type }}
      containers:
        - name: api
          image: "{{ $.Values.api.image.repository }}:{{ $.Values.api.image.tag }}"
          imagePullPolicy: {{ $.Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: VERSION
              value: {{ $name | quote }}
            - name: DATABASE_URL
              value: {{ $.Values.database.url | quote }}
            - name: DRAIN_DELAY
              value: {{ $.Values.api.drainDelay | quote }}
            {{- range $k, $val := $v.env }}
            - name: {{ $k }}
              value: {{ $val | quote }}
            {{- end }}
          lifecycle:
            preStop:
              httpGet:
                path: /prestop
                port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: {{ $.Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ $.Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml $.Values.securityContext.capabilities | nindent 14 }}
          resources:
            {{- toYaml $.Values.api.resources | nindent 12 }}
---
{{- end }}
{{- end }}
