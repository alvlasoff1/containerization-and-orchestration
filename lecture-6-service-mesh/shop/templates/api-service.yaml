{{- define "shop.apiServiceAnnotations" -}}
{{- if .Values.mesh.retries.enabled }}
retry.linkerd.io/http: {{ .Values.mesh.retries.statuses | quote }}
retry.linkerd.io/limit: {{ .Values.mesh.retries.limit | quote }}
retry.linkerd.io/timeout: {{ .Values.mesh.retries.timeout | quote }}
{{- end }}
{{- if .Values.mesh.failureAccrual.enabled }}
balancer.linkerd.io/failure-accrual: consecutive
balancer.linkerd.io/failure-accrual-consecutive-max-failures: {{ .Values.mesh.failureAccrual.consecutiveMaxFailures | quote }}
{{- end }}
{{- end -}}
# Общий Service: точка входа клиентов, выбирает pod'ы всех версий.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" . }}-api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with (include "shop.apiServiceAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "shop.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
{{- range $name, $v := .Values.api.versions }}
---
# Service одной версии — backend для traffic split.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.fullname" $ }}-api-{{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
    app.kubernetes.io/version: {{ $name }}
  {{- with (include "shop.apiServiceAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
    app.kubernetes.io/version: {{ $name }}
  ports:
    - name: http
      port: {{ $.Values.api.service.port }}
      targetPort: http
{{- end }}
