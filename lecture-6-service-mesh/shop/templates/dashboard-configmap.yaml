{{- if .Values.monitoring.dashboard.enabled }}
# Дашборд подхватывает sidecar Grafana из lab2 (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop.fullname" . }}-mesh-dashboard
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  shop-mesh.json: |-
    {{- .Files.Get "dashboards/shop-mesh.json" | replace "__NS__" .Release.Namespace | nindent 4 }}
{{- end }}
