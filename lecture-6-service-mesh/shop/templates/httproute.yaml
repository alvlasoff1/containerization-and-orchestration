{{- if .Values.trafficSplit.enabled }}
{{- $v2 := int .Values.trafficSplit.v2Weight }}
# Traffic split v1/v2: Linkerd применяет HTTPRoute, привязанный к Service
# shop-api, на стороне клиентского прокси. Вес v2 меняет gate-скрипт.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shop.fullname" . }}-api-split
  labels:
    {{- include "shop.labels" . | nindent 4 }}
  {{- with (include "shop.apiServiceAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ include "shop.fullname" . }}-api
      kind: Service
      group: core
      port: {{ .Values.api.service.port }}
  rules:
    - backendRefs:
        - name: {{ include "shop.fullname" . }}-api-v1
          port: {{ .Values.api.service.port }}
          weight: {{ sub 100 $v2 }}
        - name: {{ include "shop.fullname" . }}-api-v2
          port: {{ .Values.api.service.port }}
          weight: {{ $v2 }}
{{- end }}
