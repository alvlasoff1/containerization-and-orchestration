# Login for the postgres user CloudNativePG creates when it bootstraps the
# database. bootstrap.initdb.secret in postgres-cluster.yaml points at this.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop.fullname" . }}-postgres-credentials
  labels:
    {{- include "shop.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.database.user | default "shop" | quote }}
  password: {{ .Values.database.password | default "shop" | quote }}
