{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- range $component := list "api" "worker" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shop.fullname" $ }}-{{ $component }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
---
{{- end }}
{{- end }}
{{- with .Values.monitoring.network }}
{{- if .enabled }}
# Сетевые метрики: Hubble отдаёт дропы, вердикты политик, TCP-флаги и DNS
# по каждому pod'у; CoreDNS — здоровье DNS со стороны сервера.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shop.fullname" $ }}-hubble
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .hubble.selector | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .hubble.namespace }}
  endpoints:
    - port: {{ .hubble.port }}
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shop.fullname" $ }}-coredns
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .coredns.selector | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .coredns.namespace }}
  endpoints:
    - port: {{ .coredns.port }}
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- end }}
