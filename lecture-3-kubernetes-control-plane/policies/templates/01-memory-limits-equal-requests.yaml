apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8smemorylimitsequalrequests
spec:
  crd:
    spec:
      names:
        kind: K8sMemoryLimitsEqualRequests
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8smemorylimitsequalrequests

        violation[{"msg": msg}] {
          c := input_containers[_]
          limit := object.get(c, ["resources", "limits", "memory"], "")
          request := object.get(c, ["resources", "requests", "memory"], "")
          limit != request
          msg := sprintf("container <%v>: memory limit (%v) must equal memory request (%v)", [c.name, limit, request])
        }

        input_containers[c] { c := input.review.object.spec.containers[_] }
        input_containers[c] { c := input.review.object.spec.initContainers[_] }
