# Values for the grafana/loki chart — single-binary, filesystem storage.
# This is the smallest sane Loki for a local cluster: one pod, logs on disk,
# no S3/MinIO, no memcached. Not for production.

deploymentMode: SingleBinary

loki:
  auth_enabled: false          # no multi-tenant X-Scope-OrgID header needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h     # 7d; lab-sized
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  # No StorageClass in the cluster, so no PVC. Loki's root FS is read-only, so
  # /var/loki still needs a writable volume — give it an ephemeral emptyDir.
  # Data lives only as long as the pod; fine for a lab.
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki

# SimpleScalable targets default to 3 replicas each; zero them out so the chart
# doesn't think both deployment modes are active at once.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Strip everything the single-binary mode doesn't need on a local cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# The gateway (nginx) gives one stable Service — loki-gateway — that proxies
# both the push API (Vector writes here) and the query API (Grafana reads here).
gateway:
  enabled: true
