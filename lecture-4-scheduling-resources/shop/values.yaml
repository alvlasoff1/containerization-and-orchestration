
image:
  registry: alvlasoff
  pullPolicy: IfNotPresent
database:
  url: "postgres://shop:shop@shop-postgres-rw:5432/shop?sslmode=disable"

spread:
  mechanism: podAntiAffinity
  required: true
  topologyKey: kubernetes.io/hostname

priorityClasses:
  critical:
    name: shop-critical
    value: 100000
    description: "Critical shop workloads"
  batch:
    name: shop-batch
    value: 100
    description: "Background batch workload"

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

api:
  replicaCount: 2
  image:
    repository: api
    tag: "0.0.7"
  strategy:
    # При обязательном anti-affinity на двух нодах rollout должен уметь
    # временно уменьшить старую ReplicaSet, иначе старая и новая реплики
    # блокируют друг друга.
    maxUnavailable: 1
    maxSurge: 1
  service:
    type: NodePort
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 100Mi
  priorityClassName: shop-critical
  pdb:
    enabled: true
    minAvailable: 1
  healthFail: false
  drainDelay: "5s"
  terminationGracePeriodSeconds: 30

worker:
  replicaCount: 2
  image:
    repository: worker
    tag: "0.0.1"
  pollInterval: "2s"
  priorityClassName: shop-critical
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
  healthFail: false

postgres:
  priorityClassName: shop-critical
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 256Mi

batch:
  replicaCount: 2
  image:
    repository: batch
    tag: "0.0.1"
  priorityClassName: shop-batch
  burnCpus: 5
  memMb: 64
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 2500m
      memory: 3000Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
    latencyP95Seconds: 0.3
    errorRatio: 0.01
    throttleRatio: 0.25
    forDuration: 1m
    throttleFor: 2m
