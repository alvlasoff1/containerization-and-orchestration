# n8n: оркестратор workflow. Метрики Prometheus включены (/metrics),
# отчёты агента пишутся на PVC в /home/node/reports.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: lab8-n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: lab8-n8n
  labels: {app: n8n}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: n8n}
  template:
    metadata:
      labels: {app: n8n}
    spec:
      nodeSelector:
        kubernetes.io/hostname: lab5-worker2
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.44.6
          env:
            - {name: N8N_PORT, value: "5678"}
            - {name: N8N_PROTOCOL, value: "http"}
            - {name: N8N_SECURE_COOKIE, value: "false"}
            - {name: WEBHOOK_URL, value: "http://n8n.lab8-n8n.svc.cluster.local:5678/"}
            - {name: GENERIC_TIMEZONE, value: "UTC"}
            - {name: N8N_DIAGNOSTICS_ENABLED, value: "false"}
            - {name: N8N_PERSONALIZATION_ENABLED, value: "false"}
            # метрики для Prometheus
            - {name: N8N_METRICS, value: "true"}
            - {name: N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL, value: "true"}
            - {name: N8N_METRICS_INCLUDE_NODE_TYPE_LABEL, value: "true"}
            - {name: N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS, value: "true"}
            - {name: N8N_METRICS_INCLUDE_API_ENDPOINTS, value: "true"}
            # запись отчётов на диск
            - {name: N8N_RESTRICT_FILE_ACCESS_TO, value: "/home/node/reports"}
          ports:
            - {name: http, containerPort: 5678}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /home/node/.n8n, subPath: n8n}
            - {name: data, mountPath: /home/node/reports, subPath: reports}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: lab8-n8n
  labels: {app: n8n}
spec:
  type: NodePort
  selector: {app: n8n}
  ports:
    - {name: http, port: 5678, targetPort: http, nodePort: 30567}
